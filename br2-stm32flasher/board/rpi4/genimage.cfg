image boot.vfat {
	vfat {
		files = { "start4.elf", "fixup4.dat", "config.txt", "cmdline.txt", "Image", "bcm2711-rpi-4-b.dtb" }
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x5354320a
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
